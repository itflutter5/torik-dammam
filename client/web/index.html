<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="scrap_market">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>scrap_market</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f4f7f3;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(23, 107, 82, 0.12), transparent 32%),
        #f4f7f3;
      transition: opacity 260ms ease, visibility 260ms ease;
    }

    #app-loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .startup-card {
      display: flex;
      min-width: 190px;
      flex-direction: column;
      align-items: center;
      padding: 28px 34px;
      border: 1px solid rgba(23, 107, 82, 0.16);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 55px rgba(23, 107, 82, 0.13);
      font-family: Arial, sans-serif;
    }

    .startup-icon {
      display: grid;
      width: 66px;
      height: 66px;
      place-items: center;
      border: 3px solid rgba(23, 107, 82, 0.16);
      border-top-color: #176b52;
      border-radius: 50%;
      color: #176b52;
      font-size: 38px;
      line-height: 1;
      animation: startup-spin 900ms linear infinite;
    }

    .startup-title {
      margin-top: 16px;
      color: #153d31;
      font-size: 18px;
      font-weight: 800;
    }

    #startup-status {
      margin-top: 7px;
      color: #68766f;
      font-size: 12px;
    }

    @keyframes startup-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .startup-icon { animation-duration: 1800ms; }
    }
  </style>
</head>
<body>
  <div id="app-loader" role="status" aria-live="polite">
    <div class="startup-card">
      <div class="startup-icon" aria-hidden="true">♻</div>
      <div class="startup-title">Torik Dammam</div>
      <div id="startup-status">Loading marketplace…</div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
